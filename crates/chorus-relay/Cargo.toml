[package]
name = "chorus-relay"
version = "2.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Chorus collaborative session relay (WebSocket)"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["websocket", "opencode", "collaboration", "relay", "pair-programming"]
categories = ["web-programming::http-server", "network-programming"]
exclude = ["tests/"]

[lib]
name = "chorus_relay"
path = "src/lib.rs"

[[bin]]
name = "chorus-relay"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["trace"] }
ipnet = "2.12.1"
http = "1.5.0"

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = "0.3"
url = "2"
serde_json = "1"
