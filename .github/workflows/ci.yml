name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: bun install

      - name: Build Rust relay
        run: cargo build -p chorus-relay --release

      - name: Rust relay tests
        run: cargo test -p chorus-relay

      - name: Type check
        run: bun run typecheck

      - name: TypeScript / Bun tests
        env:
          CHORUS_RELAY_BIN: ${{ github.workspace }}/target/release/chorus-relay
        run: bunx turbo run test

      - name: Build TypeScript packages
        run: bunx turbo run build
