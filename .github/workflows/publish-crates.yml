name: Publish to crates.io

on:
  workflow_call:
    inputs:
      dry_run:
        description: Validate packaging only; do not publish
        type: boolean
        default: false
      expected_version:
        description: Require manifest version to match (omit to skip check)
        type: string
        required: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate packaging only; do not publish
        type: boolean
        default: false
      expected_version:
        description: Require manifest version to match (omit to skip check)
        type: string
        required: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish chorus-relay
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve expected version
        id: version
        run: |
          if [ -n "${{ inputs.expected_version }}" ]; then
            EXPECTED="${{ inputs.expected_version }}"
            EXPECTED="${EXPECTED#v}"
            echo "expected=${EXPECTED}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "expected=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify crate version
        if: steps.version.outputs.expected != ''
        run: |
          CRATE_VERSION="$(grep '^version = ' crates/chorus-relay/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          EXPECTED="${{ steps.version.outputs.expected }}"
          if [ "$CRATE_VERSION" != "$EXPECTED" ]; then
            echo "chorus-relay version ${CRATE_VERSION} does not match expected ${EXPECTED}" >&2
            exit 1
          fi

      - name: Dry run packaging
        if: inputs.dry_run
        run: cargo publish -p chorus-relay --dry-run

      - name: Skip publish (already on crates.io)
        id: exists
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="$(grep '^version = ' crates/chorus-relay/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          if curl -sf "https://crates.io/api/v1/crates/chorus-relay/${VERSION}" >/dev/null; then
            echo "chorus-relay ${VERSION} is already on crates.io"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: ${{ !inputs.dry_run && steps.exists.outputs.skip != 'true' }}
        run: cargo publish -p chorus-relay --token "${CARGO_REGISTRY_TOKEN}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
