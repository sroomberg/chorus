name: Update dist

on:
  pull_request:
    branches: [main]

jobs:
  update-dist:
    name: Build and commit dist
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Only TypeScript package dist/ is committed; skip the Rust relay binary.
      - name: Build TypeScript packages
        run: bun run build:ts

      - name: Commit dist if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f packages/*/dist
          if git diff --staged --quiet; then
            echo "dist is already up to date"
          else
            git commit -m "chore: update dist [skip ci]"
            git push
          fi
