[package]
name = "chorus-zed"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Zed extension that launches the Chorus join helper as an MCP context server"

# Standalone from the monorepo Cargo workspace (wasm32-wasip2 via Zed).
[workspace]

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
zed_extension_api = "0.7.0"
